<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1115;
      --card: #171a21;
      --border: #2a2f3a;
      --text: #e6e8ee;
      --muted: #9aa3b2;
      --accent: #4f8cff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 360px;
      padding: 32px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card);
    }

    h1 {
      margin: 0 0 20px;
      font-size: 22px;
    }

    form {
      display: grid;
      gap: 6px;
    }

    label {
      margin-top: 10px;
      font-size: 13px;
      color: var(--muted);
    }

    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      color: inherit;
      font: inherit;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
    }

    button {
      font: inherit;
      cursor: pointer;
      border-radius: 8px;
    }

    button[type="submit"] {
      margin-top: 20px;
      padding: 10px 12px;
      border: 0;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
    }

    .switch {
      margin: 20px 0 0;
      font-size: 13px;
      color: var(--muted);
      text-align: center;
    }

    .switch button {
      padding: 0;
      border: 0;
      background: none;
      color: var(--accent);
      text-decoration: underline;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1 id="title">Sign in</h1>

    <form id="login-form" novalidate="false">
      <label for="login-email">Email</label>
      <input id="login-email" name="email" type="email" autocomplete="email" required />

      <label for="login-password">Password</label>
      <input id="login-password" name="password" type="password" autocomplete="current-password" required />

      <button type="submit">Sign in</button>
    </form>

    <form id="signup-form" hidden>
      <label for="signup-name">Name</label>
      <input id="signup-name" name="name" type="text" autocomplete="name" required />

      <label for="signup-email">Email</label>
      <input id="signup-email" name="email" type="email" autocomplete="email" required />

      <label for="signup-password">Password</label>
      <input id="signup-password" name="password" type="password" autocomplete="new-password" required />

      <button type="submit">Create account</button>
    </form>

    <p class="switch">
      <span id="switch-text">Don't have an account?</span>
      <button type="button" id="switch-btn" data-mode="signup">Sign up</button>
    </p>
  </main>

  <script>
    const loginForm = document.getElementById('login-form');
    const signupForm = document.getElementById('signup-form');
    const title = document.getElementById('title');
    const switchText = document.getElementById('switch-text');
    const switchBtn = document.getElementById('switch-btn');

    function show(mode) {
      const isLogin = mode === 'login';
      loginForm.hidden = !isLogin;
      signupForm.hidden = isLogin;
      title.textContent = isLogin ? 'Sign in' : 'Create account';
      switchText.textContent = isLogin ? "Don't have an account?" : 'Already have an account?';
      switchBtn.textContent = isLogin ? 'Sign up' : 'Sign in';
      switchBtn.dataset.mode = isLogin ? 'signup' : 'login';
    }

    switchBtn.addEventListener('click', () => {
      show(switchBtn.dataset.mode);
    });

    // No backend yet: just log whatever the user submitted.
    function logCredentials(event, kind) {
      event.preventDefault();
      const credentials = Object.fromEntries(new FormData(event.target).entries());
      console.log('[' + kind + '] submitted credentials', credentials);
    }

    loginForm.addEventListener('submit', (event) => logCredentials(event, 'login'));
    signupForm.addEventListener('submit', (event) => logCredentials(event, 'signup'));
  </script>
</body>
</html>
