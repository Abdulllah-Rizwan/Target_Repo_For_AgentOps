<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Todo</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #1f2328;
      --muted: #8b949e;
      --border: #e4e6ea;
      --accent: #2f6feb;
      --danger: #d1242f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 48px 16px;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .app {
      width: 100%;
      max-width: 480px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .06);
      overflow: hidden;
    }

    header { padding: 20px 20px 0; }
    h1 { margin: 0; font-size: 20px; font-weight: 600; }

    form { display: flex; gap: 8px; padding: 16px 20px; }

    input[type="text"] {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      color: inherit;
      font: inherit;
    }
    input[type="text"]:focus {
      outline: 2px solid var(--accent);
      outline-offset: -1px;
      border-color: var(--accent);
    }

    button {
      font: inherit;
      cursor: pointer;
      border-radius: 8px;
      border: 1px solid transparent;
    }

    .add {
      padding: 10px 16px;
      background: var(--accent);
      color: #fff;
      font-weight: 500;
    }
    .add:hover { filter: brightness(1.05); }

    .filters { display: flex; gap: 6px; padding: 0 20px 12px; }

    .filters button {
      padding: 4px 10px;
      background: transparent;
      border-color: var(--border);
      color: var(--muted);
      font-size: 13px;
    }
    .filters button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      border-top: 1px solid var(--border);
    }

    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
    }

    li input[type="checkbox"] {
      flex: none;
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    li .text { flex: 1; word-break: break-word; }
    li.done .text { color: var(--muted); text-decoration: line-through; }

    li .remove {
      flex: none;
      padding: 4px 6px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 18px;
      line-height: 1;
    }
    li .remove:hover { color: var(--danger); }

    .empty {
      display: block;
      padding: 24px 20px;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
    }

    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      color: var(--muted);
      font-size: 13px;
    }

    .clear {
      padding: 0;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
    }
    .clear:hover { color: var(--danger); }
  </style>
</head>
<body>
  <main class="app">
    <header><h1>Todo</h1></header>

    <form id="new-todo">
      <input id="input" type="text" placeholder="What needs doing?" autocomplete="off" autofocus />
      <button class="add" type="submit">Add</button>
    </form>

    <div class="filters" id="filters">
      <button type="button" data-filter="all" class="active">All</button>
      <button type="button" data-filter="active">Active</button>
      <button type="button" data-filter="done">Done</button>
    </div>

    <ul id="list"></ul>

    <footer>
      <span id="count">0 items left</span>
      <button class="clear" id="clear" type="button" hidden>Clear completed</button>
    </footer>
  </main>

  <script>
    const STORAGE_KEY = 'todos';

    const listEl = document.getElementById('list');
    const formEl = document.getElementById('new-todo');
    const inputEl = document.getElementById('input');
    const filtersEl = document.getElementById('filters');
    const countEl = document.getElementById('count');
    const clearEl = document.getElementById('clear');

    let todos = load();
    let filter = 'all';

    function load() {
      try {
        const raw = JSON.parse(localStorage.getItem(STORAGE_KEY));
        return Array.isArray(raw) ? raw : [];
      } catch {
        return [];
      }
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    }

    function visible() {
      if (filter === 'active') return todos.filter(t => !t.done);
      if (filter === 'done') return todos.filter(t => t.done);
      return todos;
    }

    function render() {
      listEl.innerHTML = '';
      const items = visible();

      if (!items.length) {
        const empty = document.createElement('li');
        empty.className = 'empty';
        empty.textContent = todos.length ? 'Nothing here.' : 'No todos yet. Add one above.';
        listEl.appendChild(empty);
      }

      for (const todo of items) {
        const li = document.createElement('li');
        if (todo.done) li.className = 'done';

        const check = document.createElement('input');
        check.type = 'checkbox';
        check.checked = todo.done;
        check.addEventListener('change', () => toggle(todo.id));

        const text = document.createElement('span');
        text.className = 'text';
        text.textContent = todo.text;

        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'remove';
        remove.title = 'Delete';
        remove.textContent = '\u00d7';
        remove.addEventListener('click', () => removeTodo(todo.id));

        li.append(check, text, remove);
        listEl.appendChild(li);
      }

      const left = todos.filter(t => !t.done).length;
      countEl.textContent = left + (left === 1 ? ' item left' : ' items left');
      clearEl.hidden = !todos.some(t => t.done);

      for (const btn of filtersEl.querySelectorAll('button')) {
        btn.classList.toggle('active', btn.dataset.filter === filter);
      }
    }

    function add(text) {
      todos.unshift({
        id: Date.now().toString(36) + Math.random().toString(36).slice(2),
        text,
        done: false,
      });
      save();
      render();
    }

    function toggle(id) {
      const todo = todos.find(t => t.id === id);
      if (todo) todo.done = !todo.done;
      save();
      render();
    }

    function removeTodo(id) {
      todos = todos.filter(t => t.id !== id);
      save();
      render();
    }

    formEl.addEventListener('submit', event => {
      event.preventDefault();
      const text = inputEl.value.trim();
      if (!text) return;
      add(text);
      inputEl.value = '';
      inputEl.focus();
    });

    filtersEl.addEventListener('click', event => {
      const btn = event.target.closest('button[data-filter]');
      if (!btn) return;
      filter = btn.dataset.filter;
      render();
    });

    clearEl.addEventListener('click', () => {
      todos = todos.filter(t => !t.done);
      save();
      render();
    });

    render();
  </script>
</body>
</html>
