<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bye</title>
  <style>
    :root {
      color-scheme: light dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f5f7fa;
      color: #1f2933;
    }

    main {
      max-width: 32rem;
      text-align: center;
    }

    h1 {
      margin: 0 0 0.5rem;
      font-size: 2rem;
    }

    p {
      margin: 0;
      font-size: 1rem;
      line-height: 1.6;
      color: #52606d;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #111827;
        color: #f9fafb;
      }

      p {
        color: #9aa5b1;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Bye 👋</h1>
    <p>Thanks for stopping by. You can close this window at any time.</p>
  </main>
</body>
</html>
